[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-fleet-tools"
version = "0.1.0"
description = "Sealed instrument gates: judge-gate (LLM-judge verification) and bench-seal (hash-chained benchmark receipts)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fleet_tools*"]
