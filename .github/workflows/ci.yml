name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Offline test suite (mock judges, hash chains)
        run: python -m pytest tests/ -q

  keyscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Key-scan negative control (fail on credential-shaped literals)
        run: |
          ! grep -rEn "apikey_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{8,}|sk-di-[A-Za-z0-9]{8,}|moth_[A-Za-z0-9]{8,}|gsk_[A-Za-z0-9]{8,}" \
            --include="*.py" --include="*.md" --include="*.yml" --include="*.toml" .
